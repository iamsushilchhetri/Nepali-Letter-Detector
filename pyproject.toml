[project]
name = "nepali-letter-detector"
version = "0.1.0"
description = "Web app that recognizes handwritten Nepali (Devanagari) letters and digits using a CNN"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.0",
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "pillow>=11.0.0",
    "numpy>=2.0.0",
    "gunicorn>=23.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
